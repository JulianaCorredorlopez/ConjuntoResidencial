<section id="inicio" class="hero">
  <div class="hero__overlay"></div>
  <div class="hero__content">
    <span class="hero__badge">Propiedad Horizontal</span>
    <h1 class="hero__title">{{ conjunto.nombre }}</h1>
    <p class="hero__subtitle">{{ conjunto.eslogan }} · {{ conjunto.ciudad }}</p>
    <div class="hero__actions">
      <a href="#administracion" class="btn btn--primary">Ver administración</a>
      <a href="#contacto" class="btn btn--ghost">Contáctanos</a>
    </div>

    <div class="hero__stats">
      <div class="hero__stat">
        <strong>{{ conjunto.torres }}</strong>
        <span>Torres</span>
      </div>
      <div class="hero__stat">
        <strong>{{ conjunto.unidades }}</strong>
        <span>Unidades</span>
      </div>
      <div class="hero__stat">
        <strong>{{ conjunto.anioConstruccion }}</strong>
        <span>Fundación</span>
      </div>
    </div>
  </div>
</section>
